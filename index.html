<body style="margin:0; background:#EFE7D6;">
<div id="app" dir="rtl"></div>

<style>
  #app {
    --paper: #EFE7D6;
    --card: #FBF8F1;
    --ink: #2B2118;
    --ink-soft: #7A6B58;
    --line: #CDBFA0;
    --visited: #4C6B3F;
    --visited-bg: #E3E8D6;
    --new: #A8531F;
    --new-bg: #F3DCC7;
    --link: #7A5A34;
    --link-bg: #F1E8D6;

    font-family: 'Heebo', 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 20px 16px 40px;
    border-radius: 14px;
    max-width: 560px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #app * { box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap');

  .eyebrow { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
  h1 { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 27px; margin: 0 0 4px; line-height: 1.15; }
  .subtitle { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 18px; }

  .progress-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 22px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: var(--ink-soft); }
  .progress-label b { color: var(--ink); font-weight: 700; }
  .progress-bar { height: 8px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--visited); border-radius: 5px; width: 0%; transition: width .3s ease; }

  .regions { position: relative; padding-right: 22px; }
  .regions::before { content: ''; position: absolute; top: 4px; bottom: 4px; right: 9px; width: 2px; background: var(--line); }

  .region { position: relative; margin-bottom: 14px; }
  .region-marker { position: absolute; right: -18px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
  .region-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px; padding: 6px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .region-head-left { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .region-title { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 16.5px; }
  .region-count { font-size: 11.5px; color: var(--ink-soft); }
  .region-time { font-size: 11px; color: var(--ink-soft); white-space: nowrap; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; }
  .chevron { font-size: 12px; color: var(--ink-soft); transition: transform .2s; flex: 0 0 auto; }
  .region.collapsed .chevron { transform: rotate(-90deg); }
  .region.collapsed .items { display: none; }

  .items { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item.visited { background: var(--visited-bg); }

  .checkbox {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-soft);
    margin-top: 2px; display: flex; align-items: center; justify-content: center; background: var(--card);
    transition: background .15s, border-color .15s; cursor: pointer;
  }
  .item.visited .checkbox { background: var(--visited); border-color: var(--visited); }
  .checkbox svg { opacity: 0; width: 13px; height: 13px; }
  .item.visited .checkbox svg { opacity: 1; }

  .item-text { flex: 1 1 auto; min-width: 0; cursor: pointer; }
  .item-name { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .item.visited .item-name { color: var(--visited); font-weight: 700; }
  .item-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badge-new { font-size: 10px; font-weight: 700; color: var(--new); background: var(--new-bg); border-radius: 20px; padding: 1px 7px; }

  .nav-links { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .nav-links a, .nav-links button {
    font-size: 11px; font-weight: 700; color: var(--link); background: var(--link-bg);
    border-radius: 8px; padding: 4px 9px; text-decoration: none; border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; line-height: 1.4;
  }
  .nav-links a:active, .nav-links button:active { opacity: .7; }
  .copy-btn.copied { background: var(--visited-bg); color: var(--visited); border-color: var(--visited); }

  .unclear { margin-top: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }
  .unclear-title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .unclear-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.5; }
  .unclear .items { margin-top: 0; }
  .unclear .item-sub { font-style: italic; }

  .footer { text-align: center; margin-top: 22px; font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; }
  .footer button { background: none; border: none; color: var(--ink-soft); text-decoration: underline; font-size: 11.5px; cursor: pointer; padding: 4px; }

  @media (prefers-reduced-motion: reduce) { .progress-fill, .checkbox, .chevron { transition: none; } }
</style>

  async function copyToClipboard(text, btnEl){
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch(e) { ok = false; }
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch(e) { ok = false; }
    }
    if (btnEl) {
      const original = btnEl.textContent;
      btnEl.textContent = ok ? '✓ הועתק' : 'סמנו והעתיקו ידנית';
      btnEl.classList.toggle('copied', ok);
      setTimeout(() => { btnEl.textContent = original; btnEl.classList.remove('copied'); }, 1800);
    }
  }

    html += '<div class="eyebrow">היומן שלך</div>';
    html += '<h1>עגלות קפה בצפון</h1>';
    html += '<div class="subtitle">מהבית בקריית חיים ועד רמת הגולן — מסודר מהקרוב לרחוק. געו על שם המקום כדי לסמן ביקור. "העתק כתובת" מעתיק את הכתובת להדבקה בוויז/מפות — עובד תמיד. כפתורי Waze/Maps ינסו לפתוח ישירות, אבל בתוך תצוגת הארטיפקט לפעמים זה חסום.</div>';

    html += '<div class="progress-wrap">' +
      '<div class="progress-label"><span>ביקרת</span><b id="progress-text"></b></div>' +
      '<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>' +
    '</div>';

    html += '<div class="regions">';
    regions.forEach(r => {
      const hasVisited = r.items.some(it => state[it.id]);
      const visitedCount = r.items.filter(it => state[it.id]).length;
      html += '<div class="region' + (hasVisited ? '' : ' collapsed') + '" data-region="' + r.key + '">' +
        '<div class="region-marker"></div>' +
        '<div class="region-head" data-region-toggle="1">' +
          '<div class="region-head-left"><div class="region-title">' + r.title + '</div><div class="region-count" data-count="1">' + visitedCount + '/' + r.items.length + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:6px;"><div class="region-time">' + r.time + ' מהבית</div><div class="chevron">▾</div></div>' +
        '</div>' +
        '<div class="items">' + r.items.map(itemRowFull).join('') + '</div>' +
      '</div>';
    });
    html += '</div>';

    html += '<div class="unclear">' +
      '<div class="unclear-title">מיקום לא זוהה בוודאות</div>' +
      '<div class="unclear-note">לא הצלחתי לאתר עבורם מיקום מהימן — קישורי הניווט כאן הם ניחוש לפי שם בלבד, כדאי לוודא לפני שיוצאים.</div>' +
      '<div class="items">' + unclear.map(itemRowFull).join('') + '</div>' +
    '</div>';

    html += '<div class="footer">געו במקום כדי לסמן שביקרתם — נשמר אוטומטית · לוחצים על כותרת אזור כדי לפתוח/לסגור אותו<br><button id="reset-btn">איפוס הכל</button></div>';

    app.innerHTML = html;

    app.querySelectorAll('.item').forEach(el => {
      el.querySelectorAll('[data-toggle="1"]').forEach(t => {
        t.addEventListener('click', () => toggle(el.dataset.id));
      });
    });
    app.querySelectorAll('[data-navlink="1"]').forEach(a => {
      a.addEventListener('click', (e) => e.stopPropagation());
    });
    app.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        copyToClipboard(btn.dataset.copy, btn);
      });
    });
    app.querySelectorAll('[data-region-toggle="1"]').forEach(h => {
      h.addEventListener('click', () => {
        h.closest('.region').classList.toggle('collapsed');
      });
    });
    document.getElementById('reset-btn').addEventListener('click', resetAll);

    updateProgress();
  }

  function updateItemUI(id){
    const el = app.querySelector('.item[data-id="' + id + '"]');
    if (el) el.classList.toggle('visited', !!state[id]);
    const region = regions.find(r => r.items.some(it => it.id === id));
    if (region) {
      const regionEl = app.querySelector('.region[data-region="' + region.key + '"]');
      if (regionEl) {
        const count = region.items.filter(it => state[it.id]).length;
        regionEl.querySelector('[data-count="1"]').textContent = count + '/' + region.items.length;
      }
    }
  }

  function updateProgress(){
    const total = allItems.length;
    const done = Object.values(state).filter(Boolean).length;
    const pct = Math.round((done/total)*100);
    document.getElementById('progress-text').textContent = done + ' מתוך ' + total;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.set === 'function';

  async function saveState(){
    try {
      if (hasClaudeStorage) {
        await window.storage.set('coffee-checklist-state-v2', JSON.stringify(state), false);
      } else if (window.localStorage) {
        window.localStorage.setItem('coffee-checklist-state-v2', JSON.stringify(state));
      }
    } catch(e) { console.error('save failed', e); }
  }

  function toggle(id){
    state[id] = !state[id];
    updateItemUI(id);
    updateProgress();
    saveState();
  }

  function resetAll(){
    allItems.forEach(it => state[it.id] = !!it.visited);
    render();
    saveState();
  }

  async function loadState(){
    try {
      if (hasClaudeStorage) {
        const res = await window.storage.get('coffee-checklist-state-v2', false);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          Object.keys(saved).forEach(id => { if (id in state) state[id] = saved[id]; });
        } else {
          await saveState();
        }
      } else if (window.localStorage) {
        const raw = window.localStorage.getItem('coffee-checklist-state-v2');
        if (raw) {
          const saved = JSON.parse(raw);
          Object.keys(saved).forEach(id => { if (id in state) state[id] = saved[id]; });
        } else {
          await saveState();
        }
      }
    } catch(e) {
      saveState();
    }
    render();
  }

  render();
  loadState();
})();
</script>
</body>
</html>
